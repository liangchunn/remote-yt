[package]
name = "remote-yt"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
glob = "0.3.3"
reqwest = { version = "0.13.4", features = ["json"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_urlencoded = "0.7.1"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "process", "rt", "time"] }
tokio-util = "0.7.18"
toml = "1.1.2"
tower-http = { version = "0.6.11", features = ["compression-gzip", "compression-deflate", "fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
